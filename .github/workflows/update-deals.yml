name: Update deals

on:
  schedule:
    - cron: "30 2 * * *"  # daily 08:00 IST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      # EU/JP title catalogues are slow to build; reuse them for a week (key rotates weekly)
      - uses: actions/cache@v4
        with:
          path: |
            eu_catalog.json
            jp_catalog.json
          key: catalogs-${{ steps.week.outputs.week }}

      - name: AR vs US
        run: python3 eshop_compare.py --from AR --to US --min-discount-pct 50

      - name: US vs JP
        run: python3 eshop_compare.py --from US --to JP --where "saving > 0" --sort popularity

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add deals_*.csv
          git diff --cached --quiet && { echo "no changes"; exit 0; }
          git commit -m "Update deals $(date -u +%F)"
          git push
